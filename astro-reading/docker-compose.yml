# Local Qdrant for the planned vector knowledge base (see docs/backlog.md).
# It holds reference material only, never user data.
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: astro-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
